name: Probe rate sources (temporary)
on:
  push:
    branches: [claude/rates-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
        working-directory: scripts
      - run: node probe/probe.js
